  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand-link" href="index.html">
            <img class="brand-icon" src="Icon_new.png" alt="SC icon">
            <span><strong>SAMMI CHIYAO</strong></span>
          </a>
          <nav class="topnav" aria-label="Primary">
            <a class="nav-link" href="index.html">BIO</a>
            <a class="nav-link" href="publications.html">PUBLICATIONS</a>
            <a class="nav-link" href="awards.html">AWARDS/HONORS</a>
            <a class="nav-link" href="contact.html" aria-current="page">CONTACT</a>
          </nav>
          <a
            class="social-link"
            href="https://www.instagram.com/sammichiyao/"
            target="_blank"
            rel="noreferrer"
            aria-label="Instagram"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"></rect>
              <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"></circle>
              <circle cx="17.3" cy="6.8" r="1.2" fill="currentColor"></circle>
            </svg>
          </a>
        </div>
      </header>

      <main class="page contact-page">
        <form
          class="contact-form"
          action="https://formsubmit.co/sammichiyao@gmail.com"
          method="POST"
        >
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_subject" value="Website contact form">
          <label>
            <span>NAME</span>
            <input type="text" name="name" required>
          </label>
          <label>
            <span>EMAIL</span>
            <input type="email" name="email" required>
          </label>
          <label>
            <span>MESSAGE</span>
            <textarea name="message" required></textarea>
          </label>
          <button type="submit">SEND</button>
        </form>
      </main>
    </div>
  </body>
